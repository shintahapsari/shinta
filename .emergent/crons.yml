crons:
  - name: anomaly-digest
    description: "Kirim ringkasan anomali harian ke admin setiap hari pukul 08:00 WIB"
    cron: "0 8 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/anomaly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-trend
    description: "Kirim laporan tren mingguan ke admin setiap Senin pukul 08:00 WIB"
    cron: "0 8 * * 1"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/weekly-trend"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
